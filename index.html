<style>
:root{
  --teal:#8BCDC6; --green:#9BC55E; --brown:#655244; --orange:#E05722; --yellow:#F8B135; --grey:#727F87;
  --ink:#231f1c; --paper:#faf7f2; --line:#e6e0d6; --muted:#7d766d;
  --dark:#1b1b1d; --dark2:#26262a; --dark3:#323238; --darkline:#3c3c43;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.display{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;letter-spacing:.01em;line-height:.9;text-transform:uppercase}
.mono{font-family:"Space Mono",monospace}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- motif FFPMI ---------- */
.motif{position:absolute;pointer-events:none}
.q{position:absolute;width:var(--s);height:var(--s)}
.q.tl{border-top-left-radius:100%}.q.tr{border-top-right-radius:100%}.q.bl{border-bottom-left-radius:100%}.q.br{border-bottom-right-radius:100%}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden}
.login-art{position:relative;background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.login-art h1{font-size:clamp(56px,7.6vw,132px);margin:0;position:relative;z-index:2;overflow-wrap:anywhere}
.login-art h1 .y{display:block;color:var(--yellow);font-size:.62em;margin-top:.18em}
.login-art .tag{font-family:"Space Mono",monospace;color:var(--teal);font-size:15px;position:relative;z-index:2}
.login-art .foot{position:relative;z-index:2;font-size:13px;color:#b9b2a8;max-width:420px;line-height:1.6}
.login-form{display:flex;flex-direction:column;justify-content:center;padding:56px clamp(28px,6vw,96px);gap:22px;position:relative}
.login-form img{width:190px}
.login-form h2{font-size:44px;margin:8px 0 0}
.codebox{display:flex;gap:10px}
.codebox input{flex:1;font-family:"Space Mono",monospace;font-size:26px;letter-spacing:.25em;text-transform:uppercase;padding:16px 18px;border:2px solid var(--ink);border-radius:14px;background:#fff;min-width:0}
.codebox input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(224,87,34,.15)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14px;background:var(--ink);color:#fff;transition:transform .12s, background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.orange{background:var(--orange)}.btn.teal{background:var(--teal);color:var(--ink)}.btn.green{background:var(--green);color:var(--ink)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.err{color:var(--orange);font-weight:600;min-height:20px}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:12px 26px}
.top .brand{display:flex;align-items:center;gap:12px}
.top .brand img{height:30px;background:#fff;border-radius:8px;padding:4px 6px}
.top .brand .display{font-size:28px;white-space:nowrap}
.top .brand .display span{color:var(--yellow)}
.top nav{display:flex;gap:6px;margin-left:16px;flex-wrap:nowrap;overflow-x:auto}
.top nav button{white-space:nowrap;background:transparent;color:#d8d2c9;border:0;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px}
.top nav button.on{background:#fff;color:var(--ink)}
.top .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;white-space:nowrap}
.top .who b{color:var(--teal)}
.wrap{max-width:1320px;margin:0 auto;padding:34px 26px 80px}
.hero{position:relative;overflow:hidden;border-radius:28px;background:#fff;border:1px solid var(--line);padding:34px 38px;margin-bottom:28px}
.hero h2{font-size:clamp(40px,5vw,72px);margin:0}
.hero p{max-width:640px;line-height:1.6;margin:12px 0 0}
.hero .motif{right:0;top:0;width:260px;height:100%}
.hero > :not(.motif){position:relative;z-index:1;max-width:calc(100% - 250px)}

/* ---------- cartes dossiers ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.dcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:left;overflow:hidden;transition:transform .15s, box-shadow .15s;min-height:170px;display:flex;flex-direction:column;gap:10px}
.dcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(35,31,28,.10)}
.dcard .num{font-size:64px;line-height:.85}
.dcard .lbl{font-family:"Space Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.dcard .bar{height:6px;border-radius:9px;background:#efe9df;overflow:hidden;margin-top:auto}
.dcard .bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.dcard .st{font-size:12px;font-weight:700}
.dcard .corner{position:absolute;right:-1px;top:-1px;width:54px;height:54px;border-bottom-left-radius:100%}
.dcard.valide .corner{background:var(--green)}.dcard.cours .corner{background:var(--yellow)}.dcard.afaire .corner{background:var(--teal)}.dcard.prep .corner{background:#ddd}
.dcard.prep{opacity:.55;cursor:not-allowed}

/* ---------- notation (salle sombre) ---------- */
.room{background:var(--dark);color:#eee;min-height:calc(100vh - 54px);display:grid;grid-template-columns:1fr 430px}
.stage{position:relative;display:flex;flex-direction:column;min-width:0}
.stage-top{display:flex;align-items:center;gap:14px;padding:16px 22px;color:#bbb}
.stage-top .display{font-size:34px;color:#fff}
.stage-img{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 22px 10px;min-height:0;position:relative}
.stage-img img{max-width:100%;max-height:calc(100vh - 250px);object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:zoom-in;background:#111}
.stage-img .load{position:absolute;font-family:"Space Mono",monospace;color:#777}
.navarrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:24px}
.navarrow:hover{background:rgba(255,255,255,.18)}
.navarrow.l{left:14px}.navarrow.r{right:14px}
.strip{display:flex;gap:8px;padding:12px 22px 18px;overflow-x:auto}
.strip button{flex:0 0 auto;width:62px;height:62px;border-radius:12px;border:2px solid transparent;background:#000 center/cover no-repeat;position:relative;opacity:.55}
.strip button.on{border-color:var(--yellow);opacity:1}
.strip button.done{opacity:.9}
.strip button span{position:absolute;left:4px;bottom:3px;font-family:"Space Mono",monospace;font-size:11px;font-weight:700;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:6px}
.strip button.done::after{content:"";position:absolute;right:5px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.panel{background:var(--dark2);border-left:1px solid var(--darkline);padding:22px 22px 30px;overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
.sujet .n{font-family:"Space Mono",monospace;color:var(--yellow);font-size:13px}
.sujet h3{font-family:"Big Shoulders Display";font-weight:800;font-size:30px;text-transform:uppercase;line-height:1;margin:6px 0 10px;color:#fff}
details.consignes{background:var(--dark3);border-radius:12px;padding:10px 14px;margin-bottom:18px}
details.consignes summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--teal)}
details.consignes ul{margin:10px 0 2px;padding-left:18px;font-size:13px;line-height:1.55;color:#cfcfcf}
.crit{margin-bottom:16px}
.crit .ch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px;color:#e8e8e8}
.crit .ch i{width:12px;height:12px;border-radius:0 0 0 100%;flex:0 0 auto}
.crit .ch .v{margin-left:auto;font-family:"Space Mono",monospace;font-weight:700;color:#fff}
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.scale button{height:40px;border-radius:9px;border:1px solid var(--darkline);background:var(--dark3);color:#ddd;font-family:"Space Mono",monospace;font-size:12px;font-weight:700;padding:0}
.scale button.half{font-size:11px;color:#a8a8a8;font-weight:400}
.scale button:hover{border-color:#777}
.scale button.on{color:var(--ink);border-color:transparent}
.total{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--darkline);padding-top:16px;margin-top:6px}
.total .big{font-family:"Big Shoulders Display";font-weight:900;font-size:64px;line-height:.8;color:#fff}
.total .big small{font-size:26px;color:#888}
.saved{font-size:12px;color:#8a8a8a;font-family:"Space Mono",monospace}
.saved.ok{color:var(--green)}.saved.ko{color:var(--orange)}
.panel .actions{display:flex;gap:10px;margin-top:18px}
.lock{background:rgba(155,197,94,.12);border:1px solid rgba(155,197,94,.4);color:var(--green);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}

/* ---------- tables ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:22px}
.card h3{font-family:"Big Shoulders Display";font-weight:800;font-size:28px;text-transform:uppercase;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:"Space Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:"Space Mono",monospace}
.scroll{overflow-x:auto}
.heat td.c{text-align:center;font-family:"Space Mono",monospace;font-size:12px;font-weight:700;min-width:54px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.ex{background:var(--orange);color:#fff}.pill.ho{background:var(--yellow);color:var(--ink)}.pill.pdf{background:var(--teal);color:var(--ink)}.pill.no{background:#eee;color:#777}.pill.st{background:var(--brown);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{border-radius:var(--r);padding:18px;color:var(--ink);position:relative;overflow:hidden}
.stat .k{font-family:"Big Shoulders Display";font-weight:900;font-size:48px;line-height:.9}
.stat .l{font-size:12px;font-weight:600;margin-top:4px}
.prix{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.prix .p{border-radius:var(--r);padding:20px;color:#fff;position:relative;overflow:hidden;min-height:130px}
.prix .p .t{font-family:"Space Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.prix .p .w{font-family:"Big Shoulders Display";font-weight:900;font-size:34px;text-transform:uppercase;line-height:.95;margin-top:10px}
.prix .p .s{font-size:13px;margin-top:6px;opacity:.9}

/* ---------- classement photos ---------- */
.classer{display:grid;grid-template-columns:260px 1fr;gap:22px}
.dlist button{display:flex;width:100%;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-weight:600;text-align:left}
.dlist button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{position:relative;border-radius:12px;overflow:hidden;background:#eee;aspect-ratio:1;border:3px solid transparent;cursor:pointer}
.thumb{background:#2a2a2e}.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .hint{position:absolute;right:8px;top:8px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px}
.thumb.sel{border-color:var(--orange)}
.thumb .badge{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-family:"Space Mono",monospace;font-weight:700;font-size:13px;border-radius:8px;padding:2px 8px}
.thumb .badge.pl{background:var(--brown)}
.thumb .badge.none{background:rgba(255,255,255,.85);color:var(--muted)}
.thumb .zoom{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;font-size:12px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chips button{min-width:42px;height:40px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;font-family:"Space Mono",monospace;font-weight:700}
.chips button.used{background:#efe9df;color:#a39c92;border-color:#d8d0c4}
.chips button.pl{background:var(--brown);color:#fff;border-color:var(--brown);padding:0 14px}
.chips button.rm{padding:0 14px}

/* ---------- modales ---------- */
.modal{position:fixed;inset:0;background:rgba(20,18,16,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:24px;max-width:560px;width:100%;padding:28px;max-height:90vh;overflow:auto}
.modal .box h3{font-family:"Big Shoulders Display";font-weight:900;font-size:36px;text-transform:uppercase;margin:0 0 10px;line-height:.95}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.lightbox{position:fixed;inset:0;background:#0b0b0c;z-index:60;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:98vw;max-height:98vh;object-fit:contain}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:13px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.ko{background:var(--orange)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;z-index:55;box-shadow:-20px 0 50px rgba(0,0,0,.2);padding:28px;overflow:auto}
.drawer h3{font-family:"Big Shoulders Display";font-weight:900;font-size:34px;text-transform:uppercase;margin:0 0 14px}
.drawer h4{font-family:"Space Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}
.drawer li{margin-bottom:6px;font-size:13px;line-height:1.5}
.analyse{line-height:1.65;font-size:14px}
.analyse h1,.analyse h2,.analyse h3{font-family:"Big Shoulders Display";font-weight:800;text-transform:uppercase;font-size:24px;margin:20px 0 6px}
.analyse table{margin:10px 0}
.inline-in{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;width:100%}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}


/* ---------- charte ---------- */
.charte{max-width:860px;margin:0 auto}
.charte .doc{background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 46px;line-height:1.7;font-size:14.5px;position:relative;overflow:hidden}
.charte .doc h2{font-family:"Big Shoulders Display";font-weight:900;font-size:44px;text-transform:uppercase;line-height:.95;margin:0 0 6px;max-width:80%}
.charte .doc h4{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:26px 0 8px}
.charte .doc p{margin:0 0 10px}
.charte .doc .art b{font-family:"Space Mono",monospace;color:var(--brown)}
.charte .sign{background:var(--ink);color:#fff;border-radius:24px;padding:32px 36px;margin-top:20px}
.charte .sign h3{font-family:"Big Shoulders Display";font-weight:900;font-size:34px;text-transform:uppercase;margin:0 0 14px;color:var(--yellow)}
.charte .sign label{display:block;font-size:12px;font-family:"Space Mono",monospace;color:#bdb6ac;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.charte .sign input[type=text]{width:100%;background:#2f2a26;border:1px solid #4a433d;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px}
.charte .sign .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.charte .pad{background:#fff;border-radius:14px;height:180px;width:100%;touch-action:none;cursor:crosshair;display:block}
.charte .check{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:14px;line-height:1.5}
.charte .check input{width:20px;height:20px;margin-top:2px;accent-color:var(--orange)}
@media (max-width:700px){.charte .doc{padding:26px 22px}.charte .sign{padding:24px 20px}.charte .sign .row{grid-template-columns:1fr}.charte .doc h2{font-size:34px;max-width:100%}}
@media (max-width:1250px){.top .brand .display{display:none}}
@media (max-width:700px){.hero > :not(.motif){max-width:100%}.hero .motif{opacity:.18;transform:scale(.7);transform-origin:top right}.dcard{min-height:130px}.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1000px){
  .login{grid-template-columns:1fr}.login-art{min-height:46vh;padding:34px}
  .room{grid-template-columns:1fr}.panel{position:static;max-height:none;border-left:0;border-top:1px solid var(--darkline)}
  .stage-img img{max-height:62vh}
  .classer{grid-template-columns:1fr}
  .top{flex-wrap:wrap;padding:10px 16px;position:static;gap:10px}.top nav{margin-left:0}.top .brand .display{font-size:22px}.top .who{margin-left:0;flex-wrap:wrap;white-space:normal}
  .panel{top:0}.stage-top{flex-wrap:wrap}
  .wrap{padding:22px 14px 60px}
}
</style>

const COULEURS_CRIT = ["var(--orange)","var(--yellow)","var(--teal)","var(--green)","#b49a86"];
const VALEURS = [0,0.5,1,1.5,2,2.5,3,3.5,4];
const S = { code:null, session:null, ref:null, view:null };
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=2) => (n==null || isNaN(n)) ? "-" : Number(n).toFixed(d).replace(".", ",");
// k = chemin dans le stockage Supabase (contient "/") ou, à défaut, identifiant Drive
const STO = k => `${SUPABASE_URL}/storage/v1/object/public/photos/${k}`;
const img = (k, w=1600) => k.includes("/") ? (w >= 1600 ? STO(k) : `${SUPABASE_URL}/storage/v1/render/image/public/photos/${k}?width=${w}&resize=contain&quality=75`) : `https://lh3.googleusercontent.com/d/${k}=w${w}`;
const imgFallback = (k, w=1600) => k.includes("/") ? STO(k) : `https://drive.google.com/thumbnail?id=${k}&sz=w${w}`;
function imgTag(id, w, extra=""){ return `<img src="${img(id,w)}" loading="lazy" referrerpolicy="no-referrer" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${imgFallback(id,w)}'}" ${extra}>`; }
const pad = n => String(n).padStart(2,"0");

function motif(colors){
  const [a,b,c,d] = colors || ["var(--teal)","var(--yellow)","var(--orange)","var(--green)"];
  return `<div class="motif" style="right:0;top:0;width:260px;height:100%">
    <div class="q tr" style="--s:120px;right:150px;top:-10px;background:${a};opacity:.9"></div>
    <div class="q" style="--s:120px;right:30px;top:-10px;background:${b};border-bottom-right-radius:28px"></div>
    <div class="q bl" style="--s:90px;right:-20px;top:110px;background:${d}"></div>
    <div class="q" style="--s:120px;right:150px;top:110px;background:${c};border-bottom-left-radius:28px"></div>
    <div class="q" style="--s:60px;right:90px;top:110px;background:var(--brown)"></div>
  </div>`;
}

function toast(msg, ko=false){
  const t = document.createElement("div"); t.className = "toast" + (ko ? " ko" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function modal(html){
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener("click", e => { if(e.target === m) m.remove(); });
  document.body.appendChild(m); return m;
}
function confirmer(titre, texte, ok="Confirmer"){
  return new Promise(res => {
    const m = modal(`<h3>${titre}</h3><div>${texte}</div><div class="actions"><button class="btn ghost" data-a="0">Annuler</button><button class="btn orange" data-a="1">${ok}</button></div>`);
    m.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { m.remove(); res(b.dataset.a === "1"); });
  });
}
function lightbox(id){
  const l = document.createElement("div"); l.className = "lightbox";
  l.innerHTML = imgTag(id, 2400); l.onclick = () => l.remove();
  document.body.appendChild(l);
}
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);
  return data;
}

function renderLogin(msg=""){
  document.title = "Portraitiste de France 2027 - Jury";
  $("#app").innerHTML = `
  <div class="login">
    <div class="login-art">
      <div class="tag">// Qualification FFPMI - session test du jury</div>
      <div>
        <h1 class="display">Portraitiste<br>de France<span class="y">2027</span></h1>
      </div>
      <div class="foot">12 images par dossier, 5 critères par image, de 0 à 4 points. Les dossiers sont anonymes : vous ne voyez qu'un numéro.</div>
      <div class="motif" style="right:-30px;bottom:-30px;top:auto;width:420px;height:420px">
        <div class="q tr" style="--s:150px;left:60px;top:0;background:var(--teal)"></div>
        <div class="q" style="--s:150px;left:210px;top:150px;background:var(--yellow);border-top-right-radius:36px"></div>
        <div class="q" style="--s:150px;left:60px;top:150px;background:var(--orange);border-bottom-left-radius:36px"></div>
        <div class="q bl" style="--s:150px;left:-90px;top:150px;background:var(--green)"></div>
        <div class="q" style="--s:150px;left:210px;top:300px;background:var(--brown)"></div>
      </div>
    </div>
    <div class="login-form">
      <img src="${LOGO}" alt="FFPMI">
      <h2 class="display">Entrer dans<br>la salle du jury</h2>
      <p class="muted" style="margin:0;line-height:1.6">Saisissez le code personnel qui vous a été transmis.</p>
      <form class="codebox" id="f">
        <input id="code" autocomplete="off" maxlength="12" placeholder="CODE" autofocus>
        <button class="btn orange">Entrer</button>
      </form>
      <div class="err" id="err">${esc(msg)}</div>
    </div>
  </div>`;
  $("#f").onsubmit = e => { e.preventDefault(); login($("#code").value); };
}

async function login(code){
  code = (code || "").trim().toUpperCase();
  if (!code) return;
  try {
    const s = await rpc("pdf_session", { p_code: code });
    if (!s) { renderLogin("Code inconnu. Vérifiez-le et réessayez."); return; }
    S.code = code; S.session = s;
    try { localStorage.setItem("pdf_code", code); } catch(e) {}
    S.ref = await rpc("pdf_reference", {});
    if (s.role === "admin") go("admin-resultats"); else if (s.role === "admin_simple") go("admin-avancement"); else go("juge-accueil");
  } catch(e) { renderLogin("Connexion impossible : " + e.message); }
}
function logout(){
  try { localStorage.removeItem("pdf_code"); } catch(e) {}
  S.code = null; S.session = null;
  history.replaceState(null, "", location.pathname);
  renderLogin();
}

/* ================= CADRE ================= */
function shell(navItems, active, body){
  const s = S.session;
  const who = s.role === "admin" ? `Super admin · ${esc(s.nom||"")}` : s.role === "admin_simple" ? `Admin · ${esc(s.admin.nom)}` : `${esc(s.juge.prenom)} ${esc(s.juge.nom)}${s.juge.president ? " <b>· Président du jury</b>" : ""}`;
  return `
  <header class="top">
    <div class="brand"><img src="${LOGO}" alt="FFPMI"><div class="display">Portraitiste de France <span>2027</span></div></div>
    <nav>${navItems.map(([k,l]) => `<button data-go="${k}" class="${k===active?"on":""}">${l}</button>`).join("")}</nav>
    <div class="who">${who}<button class="btn ghost sm" id="regl">Règlement</button><button class="btn ghost sm" id="out">Quitter</button></div>
  </header>
  ${body}`;
}
function bindShell(){
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $("#out").onclick = logout;
  $("#regl").onclick = reglement;
}
function navJuge(){
  const n = [["juge-accueil","Mes dossiers"]];
  if (S.session.juge.president) n.push(["vue-jury","Vue du jury"],["analyse","Analyse Claude"]);
  return n;
}
const NAV_ADMIN = [["admin-resultats","Résultats"],["vue-jury","Vue du jury"],["analyse","Analyse Claude"],["admin-avancement","Avancement"],["admin-classer","Classer les photos"],["admin-juges","Juges"],["admin-params","Paramètres"]];

function reglement(){
  const r = S.ref.regles || [];
  const sect = (t, k) => `<h4>${t}</h4><ul>${r.filter(x=>x.type===k).map(x=>`<li>${esc(x.texte)}</li>`).join("")}</ul>`;
  const d = document.createElement("div"); d.className = "modal"; d.style.justifyContent = "flex-end"; d.style.padding = "0";
  d.innerHTML = `<div class="drawer"><button class="btn ghost sm" style="float:right" id="x">Fermer</button><h3>Règlement</h3>
    <h4>Notation</h4><ul>${(S.ref.criteres||[]).map(c=>`<li>${esc(c.nom)}</li>`).join("")}</ul>
    <p style="font-size:13px;line-height:1.5">Chaque critère est noté de 0 à 4 (0 très faible, 1 faible, 2 moyen, 3 bien, 4 très bien), par demi-point. Chaque photo est notée sur 20.</p>
    ${sect("Important","important")}${sect("Ne sont pas autorisés","interdit")}${sect("Précisions","precision")}</div>`;
  d.onclick = e => { if (e.target === d) d.remove(); };
  document.body.appendChild(d); $("#x", d).onclick = () => d.remove();
}

function go(view, arg){
  if (S.session?.role === "juge" && !S.session.juge.charte_signee) view = "charte";
  if (S.session?.role === "admin_simple") view = "admin-avancement";
  S.view = view;
  const routes = {
    "charte": vueCharte, "juge-accueil": vueJugeAccueil, "noter": vueNoter, "vue-jury": vueJury, "analyse": vueAnalyse,
    "admin-resultats": vueResultats, "admin-avancement": vueAvancement, "admin-classer": vueClasser,
    "admin-juges": vueJuges, "admin-params": vueParams
  };
  window.scrollTo(0,0);
  (routes[view] || vueJugeAccueil)(arg);
}


/* ================= CHARTE DU JUGE ================= */
function charteHtml(c){
  return c.texte.split("\n").map(l => {
    const t = l.trim(); if (!t) return "";
    if (/^[A-ZÉÈÀ\s]+$/.test(t) || /^Dispositions générales/.test(t)) return `<h4>${esc(t.replace(/\s*:$/,""))}</h4>`;
    const m = t.match(/^➜\s*(Article \d+)\s*•\s*(.*)$/);
    if (m) return `<p class="art"><b>${m[1]}</b> · ${esc(m[2])}</p>`;
    return `<p>${esc(t)}</p>`;
  }).join("");
}

    try {

async function vueNoter(arg){
  $("#app").innerHTML = shell(navJuge(), "", `<div class="room"><div class="stage"><div class="stage-top mono"><span class="spinner"></span> Ouverture du dossier…</div></div></div>`); bindShell();

  const notes = {};
  (D.notes||[]).forEach(n => notes[n.photo_id + "|" + n.critere] = Number(n.valeur));
  const st = { idx: Math.min(arg.idx||0, D.photos.length-1) };
  // reprendre à la première photo incomplète
  if (!arg.idx) { const k = D.photos.findIndex(p => [1,2,3,4,5].some(c => notes[p.id+"|"+c] == null)); if (k > 0) st.idx = k; }

  const totalPhoto = p => { let s=0; for (let c=1;c<=5;c++){ const v=notes[p.id+"|"+c]; if (v==null) return null; s+=v; } return s; };
  const nbNotes = () => D.photos.reduce((a,p)=> a + [1,2,3,4,5].filter(c=>notes[p.id+"|"+c]!=null).length, 0);

  function draw(){
    const p = D.photos[st.idx];
    const suj = S.ref.sujets.find(s => s.numero === p.numero) || {};
    const tot = totalPhoto(p);
    const n = nbNotes();
    const body = `<div class="room">
      <div class="stage">
        <div class="stage-top"><span class="display">Dossier ${pad(D.numero)}</span><span class="mono">photo ${p.numero} / 12</span>
          <span class="mono" style="margin-left:auto">${n}/60 notes</span>
          <button class="btn ghost sm" id="back" style="color:#ddd">Mes dossiers</button></div>
        <div class="stage-img"><span class="load">chargement de l'image…</span>${imgTag((p.src||p.drive_id), 1920, 'id="main" onload="this.previousElementSibling.remove()"')}
          ${st.idx>0?`<button class="navarrow l" id="prev">‹</button>`:""}
          ${st.idx<D.photos.length-1?`<button class="navarrow r" id="next">›</button>`:""}
        </div>
        <div class="strip">${D.photos.map((q,i)=>`<button class="${i===st.idx?"on":""} ${totalPhoto(q)!=null?"done":""}" data-i="${i}" style="background-image:url('${img((q.src||q.drive_id),200)}'),url('${imgFallback((q.src||q.drive_id),200)}')"><span>${q.numero}</span></button>`).join("")}</div>
      </div>
      <aside class="panel">
        ${D.valide?`<div class="lock">Dossier validé. Les notes sont verrouillées ; seul l'administrateur peut le rouvrir.</div>`:""}
        <div class="sujet"><div class="n">PHOTO ${p.numero}${S.ref.edition_sujets==="2025"?' <span style="color:#999">· sujet du règlement 2025</span>':""}</div><h3>${esc(suj.intitule||"")}</h3></div>
        ${suj.consignes?`<details class="consignes"><summary>Consignes du sujet</summary><ul>${suj.consignes.split("\n").map(l=>`<li>${esc(l)}</li>`).join("")}</ul></details>`:""}
        ${S.ref.criteres.map((c,ci)=>{ const v = notes[p.id+"|"+c.numero];
          return `<div class="crit"><div class="ch"><i style="background:${COULEURS_CRIT[ci]}"></i>${esc(c.nom)}<span class="v">${v==null?"-":fmt(v,1)}</span></div>
          <div class="scale">${VALEURS.map(x=>`<button class="${x%1?"half":""} ${v===x?"on":""}" style="${v===x?`background:${COULEURS_CRIT[ci]}`:""}" data-c="${c.numero}" data-v="${x}" ${D.valide?"disabled":""}>${x%1?String(x).replace(".",","):x}</button>`).join("")}</div></div>`;}).join("")}
        <div class="total"><div><div class="mono" style="font-size:12px;color:#999">NOTE DE LA PHOTO</div><div class="big">${tot==null?"-":fmt(tot,1)}<small> /20</small></div></div><div class="saved" id="saved">${D.valide?"":"Enregistrement automatique"}</div></div>
        <div class="actions">
          ${st.idx<D.photos.length-1?`<button class="btn teal" id="next2" style="flex:1">Photo suivante ›</button>`:""}
          ${!D.valide && st.idx===D.photos.length-1?`<button class="btn orange" id="valider" style="flex:1">Valider le dossier</button>`:""}
        </div>
        ${!D.valide && st.idx<D.photos.length-1 && n===60?`<button class="btn orange" id="valider" style="width:100%;margin-top:10px">Valider le dossier</button>`:""}
      </aside></div>`;
    $("#app").innerHTML = shell(navJuge(), "", body); bindShell();
    $("#back").onclick = () => go("juge-accueil");
    $("#main").onclick = () => lightbox((p.src||p.drive_id));
    [["#prev",-1],["#next",1],["#next2",1]].forEach(([s,d]) => { const b=$(s); if(b) b.onclick = () => { st.idx+=d; draw(); }; });
    document.querySelectorAll(".strip [data-i]").forEach(b => b.onclick = () => { st.idx = +b.dataset.i; draw(); });
    document.querySelectorAll(".scale button").forEach(b => b.onclick = () => noter(p, +b.dataset.c, +b.dataset.v));
    const v = $("#valider"); if (v) v.onclick = valider;
  }

  async function noter(p, c, v){
    const k = p.id + "|" + c, avant = notes[k];
    notes[k] = v; draw();
    const s = $("#saved"); s.textContent = "Enregistrement…"; s.className = "saved";
    try { await rpc("pdf_noter", { p_code:S.code, p_photo:p.id, p_critere:c, p_valeur:v }); const s2=$("#saved"); if(s2){ s2.textContent="✓ Enregistré"; s2.className="saved ok"; } }
    catch(e){ notes[k] = avant; draw(); const s2=$("#saved"); if(s2){ s2.textContent="Non enregistré"; s2.className="saved ko"; } toast(e.message, true); }

  async function valider(){
    const n = nbNotes();
    if (n < 60) { const manq = D.photos.filter(p => totalPhoto(p)==null).map(p=>p.numero); toast(`Il manque des notes sur les photos ${manq.join(", ")}`, true); return; }

       <p class="muted" style="font-size:13px">Une fois validé, vous ne pourrez plus modifier vos notes.</p>`, "Valider définitivement");
    if (!ok) return;
    try { await rpc("pdf_valider", { p_code:S.code, p_dossier:D.id }); toast("Dossier " + pad(D.numero) + " validé"); go("juge-accueil"); }
    catch(e){ toast(e.message, true); }
  }

  document.onkeydown = e => {
    if (S.view !== "noter" || document.querySelector(".modal,.lightbox")) return;
    if (e.key === "ArrowRight" && st.idx < D.photos.length-1) { st.idx++; draw(); }
    if (e.key === "ArrowLeft" && st.idx > 0) { st.idx--; draw(); }
  };
  draw();
}

/* ================= CALCULS ================= */
function calculs(J){
  const photosByD = {}; J.photos.forEach(p => (photosByD[p.dossier_id] ||= []).push(p));
  const pt = {}; // pt[juge][photo] = total /20 si 5 notes
  const cnt = {};
  J.notes.forEach(n => { ((cnt[n.j] ||= {})[n.p] ||= []).push(Number(n.v)); });
  for (const j in cnt) for (const p in cnt[j]) if (cnt[j][p].length === 5) (pt[j] ||= {})[p] = cnt[j][p].reduce((a,b)=>a+b,0);
  const nbParJD = {}; J.notes.forEach(n => { const p = J.photos.find(x=>x.id===n.p); if(!p) return; const k=n.j+"|"+p.dossier_id; nbParJD[k]=(nbParJD[k]||0)+1; });
  const valid = new Set(J.validations.map(v => v.j + "|" + v.d));
  const juges = J.juges.filter(j => j.actif !== false);
  // note jury par photo
  const photoJury = {};
  J.photos.forEach(p => { const v = juges.map(j => pt[j.id]?.[p.id]).filter(x => x != null); photoJury[p.id] = v.length ? { moy: v.reduce((a,b)=>a+b,0)/v.length, min: Math.min(...v), max: Math.max(...v), n: v.length } : null; });
  // moyenne juge x dossier
  const jd = {};
  juges.forEach(j => J.dossiers.forEach(d => { const ps = photosByD[d.id] || []; const v = ps.map(p => pt[j.id]?.[p.id]); if (ps.length === 12 && v.every(x => x != null)) (jd[j.id] ||= {})[d.id] = v.reduce((a,b)=>a+b,0)/12; }));
  // dossiers
  const dossiers = J.dossiers.map(d => {
    const ps = (photosByD[d.id] || []).sort((a,b)=>a.numero-b.numero);
    const notesP = ps.map(p => photoJury[p.id]?.moy ?? null);
    const complet = ps.length === 12 && notesP.every(x => x != null);
    const moy = complet ? notesP.reduce((a,b)=>a+b,0)/12 : null;
    const minP = complet ? Math.min(...notesP) : null;
    const sous = (a,b) => { const v = ps.filter(p=>p.numero>=a && p.numero<=b).map(p=>photoJury[p.id]?.moy); return v.length && v.every(x=>x!=null) ? v.reduce((x,y)=>x+y,0)/v.length : null; };
    let titre = null;
    if (moy != null) titre = (moy>=16 && minP>=12) ? "ex" : (moy>=14 && minP>=12) ? "ho" : (moy>=12 && minP>=9) ? "pdf" : "no";
    const nbJ = juges.filter(j => jd[j.id]?.[d.id] != null).length;
    return { ...d, ps, notesP, moy, minP, titre, portraits: sous(1,8), couples: sous(9,12), nbJ };
  });
  // sévérité des juges
  const stats = juges.map(j => {
    const devs = [], xs = [], ys = [];
    J.photos.forEach(p => { const mine = pt[j.id]?.[p.id]; if (mine == null) return;
      const autres = juges.filter(o => o.id !== j.id).map(o => pt[o.id]?.[p.id]).filter(x => x != null);
      if (!autres.length) return; const m = autres.reduce((a,b)=>a+b,0)/autres.length; devs.push(mine - m); xs.push(mine); ys.push(m); });
    const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
    let corr = null;
    if (xs.length > 3) { const mx=mean(xs), my=mean(ys); let sxy=0,sxx=0,syy=0; xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my); sxx+=(x-mx)**2; syy+=(ys[i]-my)**2;}); corr = sxx&&syy ? sxy/Math.sqrt(sxx*syy) : null; }
    const tous = Object.values(pt[j.id] || {});
    return { juge: j, nbPhotos: tous.length, moyenne: tous.length ? mean(tous) : null, ecart: devs.length ? mean(devs) : null, absEcart: devs.length ? mean(devs.map(Math.abs)) : null, corr };
  });
  return { pt, jd, photoJury, dossiers, stats, juges, valid, nbParJD, photosByD };
}
const TITRES = { ex:["ex","Excellence"], ho:["ho","Honneur"], pdf:["pdf","Portraitiste de France"], no:["no","Non admis"] };
const pillTitre = t => t ? `<span class="pill ${TITRES[t][0]}">${TITRES[t][1]}</span>` : `<span class="muted">-</span>`;
function couleurEcart(e){ if (e==null) return ""; const a = Math.min(Math.abs(e)/3, 1); return e < 0 ? `background:rgba(224,87,34,${.12+a*.6})` : `background:rgba(139,205,198,${.15+a*.7})`; }

/* ================= VUE DU JURY ================= */
async function vueJury(){
  attente("vue-jury");
  let J; try { J = await chargerJury(); } catch(e) { toast(e.message, true); return; }
  const C = calculs(J);
  const seuilEcart = Number(J.parametres?.seuil_ecart || 4);
  const adm = S.session.role === "admin";
  const nomD = d => adm && d.nom ? `<div class="muted" style="font-size:11px;font-weight:500">${esc(d.nom)}</div>` : "";

/* ================= ANALYSE CLAUDE ================= */
function md(t){
  const lines = esc(t).split("\n"); let out = "", inList = false, inTable = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
  for (const l of lines){
    if (/^\s*\|/.test(l)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; if (!inTable){ out += "<div class='scroll'><table>"; inTable = true; } out += "<tr>" + l.trim().replace(/^\||\|$/g,"").split("|").map(c=>`<td>${inline(c.trim())}</td>`).join("") + "</tr>"; continue; }
    if (inTable){ out += "</table></div>"; inTable = false; }
    if (/^\s*[-*] /.test(l)) { if (!inList){ out += "<ul>"; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] /,""))}</li>`; continue; }
    if (inList){ out += "</ul>"; inList = false; }
    const h = l.match(/^(#{1,3}) (.*)/); if (h) { out += `<h3>${inline(h[2])}</h3>`; continue; }
    if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += "</ul>"; if (inTable) out += "</table></div>";
  return out;
}

      try {
        for (let tour = 0; tour < 20; tour++) {
          imp.innerHTML = `<span class="spinner"></span> Copie en cours…`;
          const { data, error } = await sb.functions.invoke("import-photos", { body: { code: S.code, lot: 20, relancer_erreurs: tour === 0 } });
          if (error) throw new Error(error.message); if (data?.error) throw new Error(data.error);
          imp.textContent = `${data.faits} copiées, ${data.restant} restantes`;
          if (!data.restant) break;
        }
        toast("Copie terminée"); vueClasser(st.d);
      } catch(e) { toast("Copie interrompue : " + e.message, true); imp.disabled = false; }
    };
    document.querySelectorAll("[data-p]").forEach(t => t.onclick = e => { if (e.target.dataset.z) return; st.sel = t.dataset.p; draw(); });
    document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => lightbox(b.dataset.z));
    document.querySelectorAll("[data-n]").forEach(b => b.onclick = async () => {
      const p = photos.find(x => x.id === st.sel); if (!p) return;
      const v = b.dataset.n, numero = (v==="P"||v==="X") ? null : +v, planche = v === "P";
      try {
        await rpc("pdf_admin_classer", { p_code:S.code, p_photo:p.id, p_numero:numero, p_planche:planche });
        if (numero) photos.forEach(x => { if (x.dossier_id===p.dossier_id && x.numero===numero && x.id!==p.id) x.numero = null; });
        p.numero = planche ? null : numero; p.planche = planche;
        const suivante = photos.filter(x=>x.dossier_id===st.d).sort((a,b)=>a.ordre-b.ordre).find(x => !x.numero && !x.planche);
        st.sel = suivante ? suivante.id : null; draw();
      } catch(e){ toast(e.message, true); }
    });
  }
  draw();
}

/* ================= ADMIN : JUGES ================= */
async function vueJuges(){
  attente("admin-juges");
  let A, SG, AS; try { [A, SG, AS] = await Promise.all([rpc("pdf_admin_donnees", { p_code:S.code }), rpc("pdf_admin_signatures", { p_code:S.code }), rpc("pdf_admin_simples", { p_code:S.code })]); } catch(e) { toast(e.message, true); return; }
  const sig = id => SG.signatures.find(x => x.juge_id === id);
  const base = location.origin + location.pathname;
  const html = `<div class="wrap">
    <section class="hero">${motif(["var(--orange)","var(--teal)","var(--green)","var(--yellow)"])}
      <div class="mono muted" style="font-size:13px">${A.juges.length} membres du jury</div>
      <h2 class="display">Les juges</h2>
      <p>${SG.signatures.length} / ${A.juges.length} chartes signées. Chaque juge a son code personnel. Envoyez-lui son lien direct : il arrive sur ses dossiers sans rien saisir, après avoir signé la charte du juge. Le président du jury a en plus accès à la vue du jury et à l'analyse Claude.</p>
    </section>
    <div class="card"><div class="scroll"><table><thead><tr><th>Juge</th><th>Code</th><th>Lien personnel</th><th>Charte</th><th>Email</th><th>Président</th><th>Actif</th></tr></thead><tbody>
    ${A.juges.map(j => `<tr data-j="${j.id}"><td><b>${esc(j.prenom)} ${esc(j.nom)}</b></td><td class="mono"><b>${esc(j.code)}</b></td>
      <td><button class="btn ghost sm" data-copy="${base}?code=${esc(j.code)}">Copier le lien</button></td>
      <td>${sig(j.id)?`<button class="btn sm green" data-sig="${j.id}">Signée le ${new Date(sig(j.id).signe_at).toLocaleDateString("fr-FR")}</button>`:`<span class="pill no">Non signée</span>`}</td>
      <td><input class="inline-in" data-f="email" value="${esc(j.email||"")}" placeholder="email"></td>
      <td><input type="radio" name="pres" data-f="pres" ${j.est_president?"checked":""}></td>
      <td><input type="checkbox" data-f="actif" ${j.actif?"checked":""}></td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="card"><h3>Admins simplifiés</h3><div class="sub">Ils voient uniquement l'avancement des juges, avec les dossiers anonymes (numéros seulement). Chacun a son propre code ; vous pouvez le désactiver ou le supprimer à tout moment.</div>
      <div class="scroll"><table><thead><tr><th>Nom</th><th>Code</th><th>Lien</th><th>Email</th><th>Actif</th><th></th></tr></thead><tbody>
      ${AS.map(a => `<tr data-a="${a.id}"><td><input class="inline-in" data-f="nom" value="${esc(a.nom)}"></td><td class="mono"><b>${esc(a.code)}</b></td>
        <td><button class="btn ghost sm" data-copy="${base}?code=${esc(a.code)}">Copier le lien</button></td>
        <td><input class="inline-in" data-f="email" value="${esc(a.email||"")}"></td><td><input type="checkbox" data-f="actif" ${a.actif?"checked":""}></td>
        <td><button class="btn ghost sm" data-del="${a.id}">Supprimer</button></td></tr>`).join("") || `<tr><td colspan="6" class="muted">Aucun admin simplifié pour l'instant.</td></tr>`}
      </tbody></table></div>
      <form id="addA" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><input class="inline-in" id="anom" placeholder="Prénom Nom" style="max-width:220px"><input class="inline-in" id="amail" placeholder="email (facultatif)" style="max-width:260px"><button class="btn sm">Ajouter un admin simplifié</button></form>
    </div></div>`;
  $("#app").innerHTML = shell(NAV_ADMIN, "admin-juges", html); bindShell();
  $("#addA").onsubmit = async e => { e.preventDefault(); try { await rpc("pdf_admin_simple_maj", { p_code:S.code, p_id:null, p_nom:$("#anom").value, p_email:$("#amail").value, p_actif:true, p_supprimer:false }); toast("Admin simplifié ajouté"); vueJuges(); } catch(err){ toast(err.message, true); } };
  document.querySelectorAll("tr[data-a]").forEach(tr => { const save = async () => { try { await rpc("pdf_admin_simple_maj", { p_code:S.code, p_id:tr.dataset.a, p_nom:$("[data-f=nom]",tr).value, p_email:$("[data-f=email]",tr).value, p_actif:$("[data-f=actif]",tr).checked, p_supprimer:false }); toast("Enregistré"); } catch(e){ toast(e.message, true); } };
    ["nom","email","actif"].forEach(f => $(`[data-f=${f}]`,tr).onchange = save); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (await confirmer("Supprimer cet accès ?", "Son code ne fonctionnera plus.", "Supprimer")) { try { await rpc("pdf_admin_simple_maj", { p_code:S.code, p_id:b.dataset.del, p_nom:"", p_email:"", p_actif:false, p_supprimer:true }); vueJuges(); } catch(e){ toast(e.message, true); } } });
  document.querySelectorAll("[data-sig]").forEach(b => b.onclick = () => {
    const g = sig(b.dataset.sig), c = SG.charte;
    const m = modal(`<h3>Charte signée</h3><div class="mono muted" style="font-size:12px">${esc(c.titre)} · ${esc(g.version)}</div>
      <p style="line-height:1.6">Je soussigné(e) <b>${esc(g.nom)}</b>, en qualité de <b>${esc(g.qualite)}</b>, ${esc(c.declaration.charAt(0).toLowerCase()+c.declaration.slice(1))}</p>
      <p>À <b>${esc(g.lieu)}</b>, le <b>${new Date(g.signe_at).toLocaleString("fr-FR")}</b></p>
      <img src="${g.png}" style="max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff">
      <div class="actions"><button class="btn ghost" data-x="annul">Annuler la signature</button><button class="btn" data-x="ok">Fermer</button></div>`);
    $("[data-x=ok]", m).onclick = () => m.remove();
    $("[data-x=annul]", m).onclick = async () => { m.remove(); if (await confirmer("Annuler la signature ?", "Le juge devra signer à nouveau la charte avant de pouvoir noter.", "Annuler la signature")) { try { await rpc("pdf_admin_annuler_signature", { p_code:S.code, p_juge:b.dataset.sig }); toast("Signature annulée"); vueJuges(); } catch(e){ toast(e.message, true); } } };
  });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast("Lien copié"); } catch(e) { modal(`<h3>Lien</h3><p class="mono" style="word-break:break-all">${esc(b.dataset.copy)}</p>`); } });
  document.querySelectorAll("tr[data-j]").forEach(tr => {
    const save = async () => {
      try { await rpc("pdf_admin_juge", { p_code:S.code, p_juge:tr.dataset.j, p_email:$("[data-f=email]",tr).value.trim()||null, p_president:$("[data-f=pres]",tr).checked, p_actif:$("[data-f=actif]",tr).checked }); toast("Enregistré"); }
      catch(e){ toast(e.message, true); }
    };
    $("[data-f=email]",tr).onchange = save; $("[data-f=actif]",tr).onchange = save;
    $("[data-f=pres]",tr).onchange = async () => { await save(); vueJuges(); };
  });
}

/* ================= ADMIN : PARAMÈTRES ================= */

  attente("admin-params");
  let J; try { J = await chargerJury(); } catch(e) { toast(e.message, true); return; }
  const p = J.parametres || {};
  const html = `<div class="wrap"><div class="card" style="max-width:640px"><h3>Paramètres</h3><div class="sub">Modifiables à tout moment, sans toucher au code.</div>
    <label><b>Seuil d'accès au second tour</b> (note sur 20, vide = non défini)</label>
    <div style="display:flex;gap:10px;margin:8px 0 20px"><input class="inline-in" id="s2" value="${esc(p.seuil_second_tour||"")}" placeholder="ex. 14" style="max-width:160px"><button class="btn sm" data-k="seuil_second_tour" data-i="s2">Enregistrer</button></div>
    <label><b>Sujets affichés aux juges</b> (les dossiers test ont été réalisés selon le règlement 2025)</label>
    <div style="display:flex;gap:10px;margin:8px 0 20px"><select class="inline-in" id="sj" style="max-width:260px"><option value="2025" ${p.sujets_test==="2025"?"selected":""}>Sujets 2025 (dossiers test)</option><option value="2027" ${p.sujets_test!=="2025"?"selected":""}>Sujets 2027</option></select><button class="btn sm" data-k="sujets_test" data-i="sj">Enregistrer</button></div>
    <label><b>Seuil d'alerte « grosse disparité »</b> (écart en points sur une photo /20)</label>
    <div style="display:flex;gap:10px;margin:8px 0 0"><input class="inline-in" id="se" value="${esc(p.seuil_ecart||"4")}" style="max-width:160px"><button class="btn sm" data-k="seuil_ecart" data-i="se">Enregistrer</button></div>
  </div></div>`;
  $("#app").innerHTML = shell(NAV_ADMIN, "admin-params", html); bindShell();
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
    try { await rpc("pdf_admin_param", { p_code:S.code, p_cle:b.dataset.k, p_valeur:$("#"+b.dataset.i).value.trim().replace(",", ".") }); toast("Enregistré"); } catch(e){ toast(e.message, true); }
  });
}

/* ================= DÉMARRAGE ================= */
(function start(){
  const q = new URLSearchParams(location.search).get("code");
  let saved = null; try { saved = localStorage.getItem("pdf_code"); } catch(e) {}
  if (q) { history.replaceState(null, "", location.pathname); login(q); }
  else if (saved) login(saved);
  else renderLogin();
})();
</script>
